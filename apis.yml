aid: maison-safqa-holdings-limited
name: Maison Safqa Holdings Limited
description: >-
  Maison Safqa Holdings Limited operates Maison Safqa, a members-only luxury flash-sale marketplace
  (built on Shopify) offering exclusive time-limited sales on high-end brands. For its partner
  brands it publishes the Maison Safqa Brand Developer API — an API-key-authenticated REST interface
  for creating products (single and bulk) and updating inventory levels, which the platform then
  syncs into Shopify with brand data taking precedence on conflict and prices converted to SAR on
  ingestion. Surfaced originally as a 500 Global portfolio lead and enriched from the provider's
  public developer portal.
